<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Штаб — доска (закрыто)</title>
<style>
  html,body{height:100%;margin:0;background:#0a0d14;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  #gate{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;}
  #gate input{background:#182234;border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:12px 14px;font-size:16px;width:min(320px,80vw);}
  #gate button{background:#00f2fe;border:none;color:#0a0d14;font-weight:700;border-radius:8px;padding:12px 20px;font-size:15px;cursor:pointer;}
  #gate button:disabled{opacity:.5;cursor:default;}
  #err{color:#fb7185;font-size:13px;min-height:18px;}
  #hint{color:#64748b;font-size:12px;max-width:340px;}
  .password-action{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:340px;}
  .password-action a{display:inline-flex;align-items:center;min-height:40px;padding:8px 13px;border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#f1f5f9;text-decoration:none;font-size:13px;font-weight:600;background:#182234;}
  .password-action a:focus-visible{outline:2px solid #00f2fe;outline-offset:2px;}
  .password-action span{color:#94a3b8;font-size:12px;line-height:1.4;}
  #board-password-change{display:none;position:fixed;z-index:10;right:12px;bottom:12px;padding:10px;background:#0a0d14;border:1px solid rgba(255,255,255,.2);border-radius:10px;box-shadow:0 8px 24px #0008;}
  iframe{border:0;width:100%;height:100vh;display:none;}
</style>
</head>
<body>
<div id="gate">
  <div style="font-size:28px;">🔒</div>
  <div style="font-size:15px;font-weight:600;">Доска Штаба — только для своих</div>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <button id="go">Открыть</button>
  <div id="err"></div>
  <div id="hint">Пароль не отправляется на сервер — доска расшифровывается прямо в этом браузере.</div>
  <div class="password-action"><a data-change-password href="https://t.me/RoxyFreelanceBot?start=change_password" target="_blank" rel="noopener noreferrer">Сменить пароль</a><span>Пароль общий для файлов и полной доски; смена в личном чате бота.</span></div>
</div>
<div id="board-password-change" class="password-action"><a data-change-password href="https://t.me/RoxyFreelanceBot?start=change_password" target="_blank" rel="noopener noreferrer">Сменить пароль</a><span>Пароль общий для файлов и полной доски; смена в личном чате бота.</span></div>
<iframe id="frame" sandbox="allow-scripts"></iframe>
<script>
const CHANGE_PASSWORD_URL = "https://t.me/RoxyFreelanceBot?start=change_password";
document.querySelectorAll("[data-change-password]").forEach(link => {
  link.addEventListener("click", event => {
    const webApp = window.Telegram && window.Telegram.WebApp;
    if (webApp && webApp.platform && webApp.platform !== "unknown" && typeof webApp.openTelegramLink === "function") {
      try {
        webApp.openTelegramLink(CHANGE_PASSWORD_URL);
        event.preventDefault();
      } catch (e) { /* Безопасная внешняя ссылка остаётся запасным путём. */ }
    }
  });
});
async function deriveKey(password, saltB64, iterations) {
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
}

async function tryOpen() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  const btn = document.getElementById("go");
  err.textContent = "";
  if (!pw) return;
  btn.disabled = true;
  try {
    const resp = await fetch("board.enc.json", { cache: "no-store" });
    const data = await resp.json();
    const key = await deriveKey(pw, data.salt, data.iterations);
    const iv = Uint8Array.from(atob(data.iv), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(data.ciphertext), c => c.charCodeAt(0));
    const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    const html = new TextDecoder().decode(plainBuf);
    const frame = document.getElementById("frame");
    frame.srcdoc = html;
    frame.style.display = "block";
    document.getElementById("pw").value = "";
    document.getElementById("gate").style.display = "none";
    document.getElementById("board-password-change").style.display = "flex";
  } catch (e) {
    err.textContent = "Неверный пароль или доска ещё не опубликована.";
    btn.disabled = false;
  }
}

document.getElementById("go").addEventListener("click", tryOpen);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryOpen(); });
</script>
</body>
</html>
