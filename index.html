<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Штаб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="docs_data.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #14121a);
    --card: var(--tg-theme-secondary-bg-color, #1f1c29);
    --text: var(--tg-theme-text-color, #f2eff8);
    --hint: var(--tg-theme-hint-color, #9a94ab);
    --accent: var(--tg-theme-button-color, #a56cf0);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --line: rgba(127,127,127,.22);
    --ok: #4cc38a; --warn: #f0b429; --bad: #ef6461;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 12px 12px 110px; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 2px 0 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--hint); margin: 20px 2px 8px; }
  .sub { color: var(--hint); font-size: 13px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .big { font-size: 40px; font-weight: 700; line-height: 1; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
  .delta { font-size: 12px; margin-left: 6px; } .up { color: var(--ok); } .down { color: var(--bad); }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 9px; background: var(--line); color: var(--hint); margin-right: 6px; }
  .chip.p1 { background: rgba(239,100,97,.18); color: var(--bad); } .chip.p2 { background: rgba(240,180,41,.18); color: var(--warn); }
  .chip.me { background: rgba(165,108,240,.2); color: var(--accent); }
  .empty { color: var(--hint); text-align: center; padding: 28px 10px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 2px; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 3; overflow-x: auto; }
  .tabs button { flex: 1 0 auto; min-height: 42px; padding: 6px 12px; border: 0; border-radius: 12px; background: var(--card); color: var(--hint); font: inherit; font-size: 13px; white-space: nowrap; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .tabs .n { display: inline-block; min-width: 18px; margin-left: 5px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .btns button { flex: 1 1 46%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--text); font: inherit; font-size: 14px; }
  .btns button.sel { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .btns button.yes.sel { background: var(--ok); border-color: var(--ok); color: #08210f; }
  .btns button.no.sel { background: var(--bad); border-color: var(--bad); color: #fff; }
  .note { font-size: 13px; color: var(--ok); margin-top: 8px; min-height: 0; }
  textarea { width: 100%; margin-top: 10px; min-height: 64px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 14px; resize: vertical; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { min-height: 92px; text-align: left; padding: 12px; border: 2px solid transparent; border-radius: 16px; background: var(--card); color: var(--text); font: inherit; }
  .tile b { display: block; font-size: 15px; margin-bottom: 3px; } .tile span { font-size: 12px; color: var(--hint); }
  .tile.sel { border-color: var(--accent); }
  .tile.danger b { color: var(--bad); }
  .step { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; }
  .dot { flex: 0 0 10px; height: 10px; margin-top: 6px; border-radius: 5px; background: var(--hint); }
  .dot.now { background: var(--ok); }
  .hint { font-size: 13px; color: var(--hint); margin: 4px 2px 12px; }
  #send { position: fixed; left: 12px; right: 12px; bottom: 12px; min-height: 52px; border: 0; border-radius: 14px; background: var(--accent);
          color: var(--accent-text); font: inherit; font-weight: 600; display: none; z-index: 5; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 76px; padding: 12px; border-radius: 12px; background: #333; color: #fff; display: none; z-index: 6; font-size: 13px; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; }
</style>
</head>
<body>
<div id="head"></div>
<div id="tabs" class="tabs"></div>
<div id="view"></div>
<button id="send"></button>
<div id="toast"></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function tick(n, one, few, many) { var m = n % 100, k = n % 10; return (m > 10 && m < 20) ? many : (k === 1 ? one : (k > 1 && k < 5 ? few : many)); }

  function readData() {
    var m = /[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return null;
    try {
      var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (e) { return null; }
  }

  // Данные приходят в адресе после «#» от бота и никуда не уходят. Действия идут только боту через Telegram.
  var d = readData();
  var head = document.getElementById('head'), tabsEl = document.getElementById('tabs'),
      view = document.getElementById('view'), sendBtn = document.getElementById('send'), toast = document.getElementById('toast');

  head.appendChild(el('h1', null, '🟣 Штаб'));
  if (!d) {
    head.appendChild(el('div', 'sub', 'Открой Mini App кнопкой «📱 Штаб» в чате с ботом: данные приходят оттуда.'));
    view.appendChild(el('div', 'empty', 'Нет данных'));
    var keys = (location.hash || '').replace(/^#/, '').split('&').map(function (p) { return p.split('=')[0]; }).filter(Boolean);
    view.appendChild(el('div', 'sub', 'Диагностика: в адресе параметры [' + keys.join(', ') + '], длина ' + (location.hash || '').length +
      ', платформа ' + (tg && tg.platform ? tg.platform : 'нет') + ', initData ' + (tg && tg.initData ? 'есть' : 'пусто')));
    return;
  }
  head.appendChild(el('div', 'sub', 'Обновлено ' + (d.t || '—') + ' · данные обновляются раз в 5 минут'));

  // ---- отправка действий боту ----
  // По документации Telegram: из кнопки клавиатуры работает sendData (initData пуст); из кнопки меню — ссылка t.me/бот?start=…
  var inTelegram = !!(tg && tg.platform && tg.platform !== 'unknown');
  var fromKeyboard = inTelegram && !tg.initData;
  var queue = {}, comments = {};
  function qcount() { return Object.keys(queue).length; }
  function showToast(t) { toast.textContent = t; toast.style.display = 'block'; setTimeout(function () { toast.style.display = 'none'; }, 4000); }
  function setAct(key, act) { if (act) queue[key] = act; else delete queue[key]; refreshSend(); }
  function refreshSend() {
    var n = qcount(), label = 'Отправить (' + n + ')';
    if (inTelegram && tg.MainButton) { if (n) { tg.MainButton.setText(label); tg.MainButton.show(); } else tg.MainButton.hide(); }
    sendBtn.textContent = label;
    sendBtn.style.display = (n && !inTelegram) ? 'block' : 'none';
  }
  var CMD_LETTER = { status: 's', limits: 'l', board: 'b', orders: 'o', pause: 'p', modes: 'r', services: 'v', sync: 'y' };
  function buildLink() {
    var parts = [];
    Object.keys(queue).forEach(function (k) {
      var a = queue[k], id = String(a.id || '').replace(/^sh-/, '');
      if (a.a === 'vote') parts.push((a.v === 'yes' ? 'y' : 'n') + id);
      else if (a.a === 'archive') parts.push('a' + id);
      else if (a.a === 'comment') parts.push('c' + id);
      else if (a.a === 'cmd' && CMD_LETTER[a.c]) parts.push('m' + CMD_LETTER[a.c]);
    });
    var p = 'd_' + parts.join('_');
    return p.length <= 64 ? p : null;
  }
  function submit() {
    var acts = Object.keys(queue).map(function (k) { return queue[k]; });
    if (!acts.length) return;
    var json = JSON.stringify({ v: 1, acts: acts });
    if (new TextEncoder().encode(json).length > 4000) { showToast('Слишком много действий за раз: отправь часть, потом остальное.'); return; }
    if (fromKeyboard) { tg.sendData(json); return; }
    if (inTelegram) {
      if (!d.b) { showToast('Бот не передал своё имя: открой Mini App из чата с ботом ещё раз.'); return; }
      var p = buildLink();
      if (!p) { showToast('Слишком много действий за раз: отправь часть, потом остальное.'); return; }
      tg.openTelegramLink('https://t.me/' + d.b + '?start=' + p);
      return;
    }
    clear(view); view.appendChild(el('div', 'card', 'Страница открыта вне Telegram, отправка недоступна. Действия:')); view.appendChild(el('pre', null, json));
  }
  sendBtn.addEventListener('click', submit);
  if (inTelegram && tg.MainButton) tg.MainButton.onClick(submit);

  // ---- вкладки ----
  var tab = 'home';
  var docsSearchTerm = '';
  var docsShowArchived = false;
  var docsAuthorFilter = 'all';
  var docsSortBy = 'date';
  var askN = d.ask ? d.ask.length : 0;
  var TABS = [['home', '🏠 Главное'], ['dec', '🗳 Решения'], ['work', '🛠 Работа'], ['docs', '📚 Документы'], ['sys', '⚙️ Система'], ['arc', '🗄 Архив']];
  function drawTabs() {
    clear(tabsEl);
    TABS.forEach(function (t) {
      var b = el('button', tab === t[0] ? 'on' : '', t[1]);
      if (t[0] === 'dec' && askN) b.appendChild(el('span', 'n', String(askN)));
      b.addEventListener('click', function () { go(t[0]); });
      tabsEl.appendChild(b);
    });
  }
  function go(t) { tab = t; drawTabs(); draw(); window.scrollTo(0, 0); }

  function bar(pct, color) {
    var b = el('div', 'bar'), f = el('i');
    f.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (color) f.style.background = color;
    b.appendChild(f); return b;
  }
  function limColor(p) { return p >= 90 ? 'var(--bad)' : (p >= 80 ? 'var(--warn)' : 'var(--ok)'); }
  function prioChip(p) { return el('span', 'chip p' + (p || 2), p === 1 ? 'срочно' : (p === 2 ? 'важно' : 'обычно')); }
  function ownerChip(o) { return el('span', 'chip' + (o === 'claude' || o === 'roxy' ? ' me' : ''), o === 'claude' ? 'Клод' : (o === 'roxy' ? 'ROXY' : (o === 'victoria' ? 'ты' : (o || 'не назначено')))); }

  // ---- Главное ----
  function home() {
    var sum = el('div', 'card'), row = el('div', 'row');
    row.appendChild(el('span', 'big', (d.all || 0) + '%'));
    row.appendChild(el('span', 'sub', 'общая готовность Штаба'));
    sum.appendChild(row); sum.appendChild(bar(d.all || 0));
    if (d.cards) sum.appendChild(el('div', 'sub', 'Задач: ' + d.cards[0] + ', сделано ' + d.cards[1] + (d.cards[2] ? ', в работе ' + d.cards[2] : '')));
    view.appendChild(sum);

    if (askN) {
      var a = el('div', 'card');
      a.appendChild(el('div', null, '🗳 Ждут твоего решения: ' + askN));
      a.appendChild(el('div', 'sub', 'Принять, отклонить или прокомментировать можно в одну минуту.'));
      var go1 = el('div', 'btns'), b1 = el('button', null, 'Открыть решения →');
      b1.addEventListener('click', function () { go('dec'); }); go1.appendChild(b1); a.appendChild(go1);
      view.appendChild(a);
    }

    if (d.sv) {
      var sc = el('div', 'card'), sr = el('div', 'row');
      sr.appendChild(el('span', null, '🧩 Сервисы'));
      sr.appendChild(el('span', 'pct', d.sv[0] + ' из ' + d.sv[1] + ' в порядке'));
      sc.appendChild(sr); sc.appendChild(bar(Math.round(100 * d.sv[0] / Math.max(1, d.sv[1])), d.sv[0] === d.sv[1] ? 'var(--ok)' : 'var(--warn)'));
      if (d.sv[2] && d.sv[2].length) sc.appendChild(el('div', 'sub', 'Внимание: ' + d.sv[2].join(', ')));
      var sb = el('div', 'btns'), sbb = el('button', null, 'Подробно →');
      sbb.addEventListener('click', function () { go('sys'); }); sb.appendChild(sbb); sc.appendChild(sb);
      view.appendChild(sc);
    }

    if (d.lim && d.lim.length) {
      view.appendChild(el('h2', null, 'Кто на связи'));
      d.lim.forEach(function (x) {
        var c = el('div', 'card'), r = el('div', 'row');
        r.appendChild(el('span', null, x[0]));
        r.appendChild(el('span', 'sub', (x[1] !== null ? x[1] + '% · ' : '') + (x[2] || '')));
        c.appendChild(r);
        if (x[1] !== null) c.appendChild(bar(x[1], limColor(x[1])));
        view.appendChild(c);
      });
      view.appendChild(el('div', 'hint', 'Проценты — сколько лимита израсходовано, «откат» — когда он обновится.'));
    }

    if (d.dirs && d.dirs.length) {
      view.appendChild(el('h2', null, 'Как идёт по направлениям'));
      d.dirs.forEach(function (x) {
        var c = el('div', 'card'), r = el('div', 'row');
        r.appendChild(el('span', null, x[0]));
        var p = el('span', 'pct', x[1] + '%');
        if (x.length > 2 && x[2] !== null && x[2] !== x[1]) {
          var diff = x[1] - x[2];
          p.appendChild(el('span', 'delta ' + (diff > 0 ? 'up' : 'down'), (diff > 0 ? '▲ +' : '▼ ') + diff));
        }
        r.appendChild(p); c.appendChild(r); c.appendChild(bar(x[1])); view.appendChild(c);
      });
    }
  }

  // ---- карточка с кнопками ----
  function cardItem(x, decision) {
    var id = x[0], c = el('div', 'card'), inMenu = inTelegram && !fromKeyboard;
    var top = el('div'); top.appendChild(prioChip(x[3])); top.appendChild(ownerChip(x[2])); top.appendChild(el('span', 'sub', id));
    c.appendChild(top);
    c.appendChild(el('div', null, x[1]));
    var btns = el('div', 'btns'), ta = null, note = el('div', 'note'), yes = null, no = null;
    function paint() {
      var v = queue['v:' + id], a = queue['a:' + id];
      if (yes) yes.classList.toggle('sel', !!v && v.v === 'yes');
      if (no) no.classList.toggle('sel', !!v && v.v === 'no');
      arc.classList.toggle('sel', !!a);
      note.textContent = [v ? (v.v === 'yes' ? '✅ принято' : '❌ отклонено') : '', a ? '🗄 уйдёт в архив' : '',
        queue['c:' + id] ? (inMenu ? '💬 текст комментария напишешь в чате' : '💬 комментарий добавлен') : ''].filter(Boolean).join(' · ');
    }
    if (decision) {
      yes = el('button', 'yes', '✅ Принять'); no = el('button', 'no', '❌ Отклонить');
      yes.addEventListener('click', function () { var cur = queue['v:' + id]; setAct('v:' + id, cur && cur.v === 'yes' ? null : { a: 'vote', id: id, v: 'yes' }); paint(); });
      no.addEventListener('click', function () { var cur = queue['v:' + id]; setAct('v:' + id, cur && cur.v === 'no' ? null : { a: 'vote', id: id, v: 'no' }); paint(); });
      btns.appendChild(yes); btns.appendChild(no);
    }
    var cm = el('button', null, '💬 Комментарий'), arc = el('button', null, '🗄 В архив');
    cm.addEventListener('click', function () {
      if (inMenu) { setAct('c:' + id, queue['c:' + id] ? null : { a: 'comment', id: id, t: '' }); paint(); return; }
      if (ta) return;
      ta = el('textarea'); ta.placeholder = 'Твой комментарий к ' + id; ta.value = comments[id] || '';
      ta.addEventListener('input', function () {
        comments[id] = ta.value.trim();
        setAct('c:' + id, comments[id] ? { a: 'comment', id: id, t: comments[id].slice(0, 500) } : null); paint();
      });
      c.insertBefore(ta, note); ta.focus();
    });
    arc.addEventListener('click', function () { setAct('a:' + id, queue['a:' + id] ? null : { a: 'archive', id: id }); paint(); });
    btns.appendChild(cm); btns.appendChild(arc);
    c.appendChild(btns); c.appendChild(note); paint();
    return c;
  }

  function decisions() {
    if (!askN) { view.appendChild(el('div', 'empty', '🎉 Ничего не ждёт твоего решения')); return; }
    view.appendChild(el('div', 'hint', 'Отметь нужное у каждой карточки и нажми «Отправить» внизу. «Принять» — делаем, «Отклонить» — не делаем, «В архив» — убрать с доски. Твой голос ставится только отсюда.'));
    d.ask.forEach(function (x) { view.appendChild(cardItem(x, true)); });
  }

  // ---- Работа ----
  function work() {
    var doing = (d.top || []).filter(function (x) { return x[4] === 'p'; });
    var next = (d.top || []).filter(function (x) { return x[4] !== 'p'; });
    function block(title, items, now) {
      view.appendChild(el('h2', null, title));
      if (!items.length) { view.appendChild(el('div', 'card sub', 'Пусто')); return; }
      var c = el('div', 'card');
      items.forEach(function (x) {
        var s = el('div', 'step'); s.appendChild(el('span', 'dot' + (now ? ' now' : '')));
        var t = el('div'); var m = el('div'); m.appendChild(ownerChip(x[2])); m.appendChild(prioChip(x[3])); m.appendChild(el('span', 'sub', x[0]));
        t.appendChild(m); t.appendChild(el('div', null, x[1])); s.appendChild(t); c.appendChild(s);
      });
      view.appendChild(c);
    }
    block('Делается сейчас', doing, true);
    block('Следующие по важности', next, false);
    view.appendChild(el('div', 'hint', 'Показаны самые важные. Полная доска — на вкладке «Система», плитка «Доска задач».'));
  }

  // ---- Система ----
  var TILES = [
    ['sync', '🔁', 'Синхронизация', 'Обновить карту, сервисы, доску; агенты сверят свои части'],
    ['services', '🧩', 'Все сервисы', 'Что работает, что по расписанию, что молчит'],
    ['status', '📊', 'Статус системы', 'Что запущено, очередь, память'],
    ['board', '📋', 'Доска задач', 'Сводка: что в работе и что ждёт'],
    ['orders', '🏆', 'Лучшие заказы', 'Свежие с бирж, лучшие сверху, кнопка «Черновик»'],
    ['modes', '🪟', 'Режимы связи', 'Окна, фон или авто для Клода и ROXY'],
    ['limits', '🚦', 'Лимиты подробно', 'Остаток и время отката'],
    ['pause', '🛑', 'Стоп / пауза', 'Отменить очередь задач', true]
  ];
  function system() {
    view.appendChild(el('div', 'hint', 'Нажми плитку и «Отправить»: ответ придёт в чат с ботом. Можно выбрать несколько.'));
    var g = el('div', 'grid');
    TILES.forEach(function (t) {
      var b = el('button', 'tile' + (t[4] ? ' danger' : '') + (queue['m:' + t[0]] ? ' sel' : ''));
      b.appendChild(el('b', null, t[1] + ' ' + t[2])); b.appendChild(el('span', null, t[3]));
      b.addEventListener('click', function () {
        var on = !queue['m:' + t[0]];
        setAct('m:' + t[0], on ? { a: 'cmd', c: t[0] } : null); b.classList.toggle('sel', on);
      });
      g.appendChild(b);
    });
    view.appendChild(g);
    view.appendChild(el('h2', null, 'Куда пишешь'));
    view.appendChild(el('div', 'card sub', 'Получатель сообщений выбирается кнопкой «🎯» на клавиатуре чата. Голос и скриншот — тоже там.'));
  }

  // ---- Архив ----
  function archive() {
    if (!d.arch || !d.arch.length) { view.appendChild(el('div', 'empty', 'Архив пуст')); return; }
    view.appendChild(el('h2', null, 'Недавно закрыто'));
    var c = el('div', 'card');
    d.arch.forEach(function (x) {
      var s = el('div', 'step'); s.appendChild(el('span', 'dot now'));
      var t = el('div'); t.appendChild(el('span', 'sub', x[0])); t.appendChild(el('div', null, x[1])); s.appendChild(t); c.appendChild(s);
    });
    view.appendChild(c);
    view.appendChild(el('div', 'hint', 'Показаны последние. Вся история хранится на доске.'));
  }

  function draw() {
    clear(view);

  function formatMarkdown(text) {
    if (!text) return '';
    var esc = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Fenced code blocks
    esc = esc.replace(/```([a-z0-9_-]*)\n([\s\S]*?)```/gim, function(m, lang, code) {
      return '<pre style="background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px;overflow-x:auto;font-family:monospace;font-size:12px;color:#c084fc;margin:8px 0;"><code>' + code + '</code></pre>';
    });

    // Table rows
    esc = esc.replace(/^\|(.+)\|$/gim, function(match, row) {
      var cells = row.split('|').map(function(c) { return c.trim(); });
      if (cells.every(function(c) { return /^:?-+:?$/.test(c); })) {
        return '';
      }
      return '<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;">' +
        cells.map(function(c) { return '<span style="flex:1;min-width:60px;">' + c + '</span>'; }).join('') +
        '</div>';
    });

    return esc
      .replace(/^### (.*$)/gim, '<h4 style="color:var(--accent);margin:10px 0 4px;font-size:14px;">$1</h4>')
      .replace(/^## (.*$)/gim, '<h3 style="color:#fff;margin:14px 0 6px;font-size:15px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:3px;">$1</h3>')
      .replace(/^# (.*$)/gim, '<h2 style="color:#fff;margin:16px 0 8px;font-size:16px;border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:4px;">$1</h2>')
      .replace(/\*\*(.*?)\*\*/gim, '<strong style="color:#fff;">$1</strong>')
      .replace(/\*(.*?)\*/gim, '<em style="color:#ddd;">$1</em>')
      .replace(/`([^`]+)`/gim, '<code style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;color:#a371f7;font-family:monospace;font-size:12px;">$1</code>')
      .replace(/^\> (.*$)/gim, '<blockquote style="border-left:3px solid var(--accent);margin:8px 0;padding:4px 10px;background:rgba(163,113,247,0.06);color:var(--text-dim);border-radius:0 6px 6px 0;">$1</blockquote>')
      .replace(/^\- (.*$)/gim, '<div style="padding-left:14px;margin:2px 0;">• $1</div>')
      .replace(/\n\n/gim, '<div style="height:8px;"></div>');
  }

  function docsView() {
    var rawDocs = window.SHTAB_DOCS || [];
    var archived = JSON.parse(localStorage.getItem('shtab_archived_docs') || '[]');

    if (!rawDocs.length) {
      view.appendChild(el('div', 'card hint', 'Документы и артефакты пока не загружены.'));
      return;
    }

    var intro = el('div', 'card');
    intro.appendChild(el('div', 'title', '📚 Документы и Артефакты (' + rawDocs.length + ')'));
    intro.appendChild(el('div', 'hint', 'База знаний, исследования, спецификации и регламенты Штаба.'));

    // Строка поиска
    var searchBox = el('div');
    searchBox.style.marginTop = '10px';
    searchBox.style.display = 'flex';
    searchBox.style.gap = '8px';
    searchBox.style.alignItems = 'center';

    var searchInput = el('input');
    searchInput.type = 'text';
    searchInput.placeholder = '🔍 Поиск по названию, задаче, автору...';
    searchInput.value = docsSearchTerm;
    searchInput.style.flex = '1';
    searchInput.style.padding = '8px 12px';
    searchInput.style.borderRadius = '8px';
    searchInput.style.border = '1px solid rgba(255,255,255,0.12)';
    searchInput.style.background = 'rgba(0,0,0,0.2)';
    searchInput.style.color = 'var(--text)';
    searchInput.style.fontSize = '13px';

    var clearBtn = el('button');
    clearBtn.textContent = '✕';
    clearBtn.style.padding = '8px 12px';
    clearBtn.style.borderRadius = '8px';
    clearBtn.style.border = '1px solid rgba(255,255,255,0.08)';
    clearBtn.style.background = 'rgba(255,255,255,0.04)';
    clearBtn.style.color = 'var(--text-dim)';
    clearBtn.style.cursor = 'pointer';
    clearBtn.title = 'Очистить поиск';
    clearBtn.style.display = docsSearchTerm ? 'inline-block' : 'none';

    var arcToggle = el('button');
    arcToggle.textContent = docsShowArchived ? '📁 Скрыть архив' : '🗄 Архив (' + archived.length + ')';
    arcToggle.style.padding = '8px 12px';
    arcToggle.style.borderRadius = '8px';
    arcToggle.style.border = '1px solid rgba(255,255,255,0.12)';
    arcToggle.style.background = docsShowArchived ? 'var(--accent)' : 'var(--card)';
    arcToggle.style.color = docsShowArchived ? '#fff' : 'var(--text)';
    arcToggle.style.fontSize = '12px';
    arcToggle.style.cursor = 'pointer';
    arcToggle.addEventListener('click', function () {
      docsShowArchived = !docsShowArchived;
      go('docs');
    });

    searchBox.appendChild(searchInput);
    searchBox.appendChild(clearBtn);
    searchBox.appendChild(arcToggle);
    intro.appendChild(searchBox);

    // Панель фильтров (Авторы + Сортировка)
    var filterRow = el('div');
    filterRow.style.marginTop = '10px';
    filterRow.style.display = 'flex';
    filterRow.style.gap = '6px';
    filterRow.style.flexWrap = 'wrap';
    filterRow.style.alignItems = 'center';

    function makeChip(label, active, onClick) {
      var c = el('button');
      c.textContent = label;
      c.style.padding = '4px 10px';
      c.style.borderRadius = '14px';
      c.style.fontSize = '11px';
      c.style.border = active ? '1px solid var(--accent)' : '1px solid rgba(255,255,255,0.08)';
      c.style.background = active ? 'rgba(163,113,247,0.22)' : 'rgba(255,255,255,0.04)';
      c.style.color = active ? '#fff' : 'var(--text-dim)';
      c.style.cursor = 'pointer';
      c.addEventListener('click', onClick);
      return c;
    }

    var chipAll = makeChip('Все авторы', docsAuthorFilter === 'all', function () {
      docsAuthorFilter = 'all';
      updateFilterButtons();
      renderList();
    });
    var chipRoxy = makeChip('🤖 ROXY', docsAuthorFilter === 'roxy', function () {
      docsAuthorFilter = 'roxy';
      updateFilterButtons();
      renderList();
    });
    var chipClaude = makeChip('🧠 Claude', docsAuthorFilter === 'claude', function () {
      docsAuthorFilter = 'claude';
      updateFilterButtons();
      renderList();
    });

    function updateFilterButtons() {
      chipAll.style.border = docsAuthorFilter === 'all' ? '1px solid var(--accent)' : '1px solid rgba(255,255,255,0.08)';
      chipAll.style.background = docsAuthorFilter === 'all' ? 'rgba(163,113,247,0.22)' : 'rgba(255,255,255,0.04)';
      chipAll.style.color = docsAuthorFilter === 'all' ? '#fff' : 'var(--text-dim)';

      chipRoxy.style.border = docsAuthorFilter === 'roxy' ? '1px solid var(--accent)' : '1px solid rgba(255,255,255,0.08)';
      chipRoxy.style.background = docsAuthorFilter === 'roxy' ? 'rgba(163,113,247,0.22)' : 'rgba(255,255,255,0.04)';
      chipRoxy.style.color = docsAuthorFilter === 'roxy' ? '#fff' : 'var(--text-dim)';

      chipClaude.style.border = docsAuthorFilter === 'claude' ? '1px solid var(--accent)' : '1px solid rgba(255,255,255,0.08)';
      chipClaude.style.background = docsAuthorFilter === 'claude' ? 'rgba(163,113,247,0.22)' : 'rgba(255,255,255,0.04)';
      chipClaude.style.color = docsAuthorFilter === 'claude' ? '#fff' : 'var(--text-dim)';
    }

    filterRow.appendChild(chipAll);
    filterRow.appendChild(chipRoxy);
    filterRow.appendChild(chipClaude);

    var sortBtn = makeChip(docsSortBy === 'date' ? '⚡ Свежие' : '🔤 А-Я', true, function () {
      docsSortBy = (docsSortBy === 'date') ? 'title' : 'date';
      sortBtn.textContent = (docsSortBy === 'date') ? '⚡ Свежие' : '🔤 А-Я';
      renderList();
    });
    filterRow.appendChild(sortBtn);

    var countBadge = el('span', 'hint');
    countBadge.style.fontSize = '12px';
    countBadge.style.marginLeft = 'auto';
    filterRow.appendChild(countBadge);

    intro.appendChild(filterRow);
    view.appendChild(intro);

    // Контейнер списка документов
    var listContainer = el('div');
    view.appendChild(listContainer);

    function renderList() {
      clear(listContainer);
      archived = JSON.parse(localStorage.getItem('shtab_archived_docs') || '[]');
      arcToggle.textContent = docsShowArchived ? '📁 Скрыть архив' : '🗄 Архив (' + archived.length + ')';

      var filtered = rawDocs.filter(function (d) {
        var isArchived = archived.indexOf(d.id) !== -1;
        if (docsShowArchived) {
          if (!isArchived) return false;
        } else {
          if (isArchived) return false;
        }

        if (docsAuthorFilter === 'roxy') {
          if ((d.author || '').toLowerCase().indexOf('roxy') === -1) return false;
        } else if (docsAuthorFilter === 'claude') {
          if ((d.author || '').toLowerCase().indexOf('claude') === -1) return false;
        }

        if (!docsSearchTerm) return true;
        var q = docsSearchTerm;
        return (d.title && d.title.toLowerCase().indexOf(q) !== -1) ||
               (d.task_id && d.task_id.toLowerCase().indexOf(q) !== -1) ||
               (d.group && d.group.toLowerCase().indexOf(q) !== -1) ||
               (d.author && d.author.toLowerCase().indexOf(q) !== -1) ||
               (d.summary && d.summary.toLowerCase().indexOf(q) !== -1);
      });

      // Сортировка
      if (docsSortBy === 'date') {
        filtered.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
      } else {
        filtered.sort(function (a, b) { return (a.title || '').localeCompare(b.title || ''); });
      }

      countBadge.textContent = 'Показано: ' + filtered.length + ' из ' + rawDocs.length;
      clearBtn.style.display = docsSearchTerm ? 'inline-block' : 'none';

      if (!filtered.length) {
        listContainer.appendChild(el('div', 'card hint', docsShowArchived ? 'В архиве нет документов.' : 'По запросу ничего не найдено.'));
        return;
      }

      var groups = {};
      filtered.forEach(function (d) {
        if (!groups[d.group]) groups[d.group] = [];
        groups[d.group].push(d);
      });

      Object.keys(groups).forEach(function (gName) {
        var gDocs = groups[gName];
        var gBox = el('div', 'card');
        gBox.appendChild(el('div', 'title', gName + ' (' + gDocs.length + ')'));

        gDocs.forEach(function (doc) {
          var isDocArchived = archived.indexOf(doc.id) !== -1;
          var item = el('div', 'item');
          item.style.padding = '10px 0';
          item.style.borderTop = '1px solid rgba(255,255,255,0.06)';

          var topRow = el('div');
          topRow.style.display = 'flex';
          topRow.style.justifyContent = 'space-between';
          topRow.style.alignItems = 'center';

          var tChip = el('span', 'prio');
          tChip.textContent = doc.task_id;
          tChip.style.background = 'rgba(163,113,247,0.18)';
          tChip.style.color = 'var(--accent)';
          tChip.style.fontWeight = '600';
          topRow.appendChild(tChip);

          var meta = el('span', 'hint');
          meta.style.fontSize = '12px';
          meta.textContent = doc.author + ' · ' + doc.date;
          topRow.appendChild(meta);

          item.appendChild(topRow);

          var dTitle = el('div');
          dTitle.style.fontWeight = '600';
          dTitle.style.fontSize = '14px';
          dTitle.style.margin = '6px 0 4px';
          dTitle.textContent = doc.title;
          item.appendChild(dTitle);

          var dSumm = el('div', 'hint');
          dSumm.style.fontSize = '13px';
          dSumm.textContent = doc.summary;
          item.appendChild(dSumm);

          // Блок ИИ-выжимки (Суть в 3 буллетах)
          var tldrBox = el('div');
          tldrBox.style.display = 'none';
          tldrBox.style.marginTop = '8px';
          tldrBox.style.padding = '10px 12px';
          tldrBox.style.background = 'rgba(163,113,247,0.1)';
          tldrBox.style.borderLeft = '3px solid var(--accent)';
          tldrBox.style.borderRadius = '0 8px 8px 0';
          tldrBox.style.fontSize = '12px';
          tldrBox.style.lineHeight = '1.5';
          tldrBox.style.color = '#e9d5ff';

          var tldrHeader = el('div');
          tldrHeader.style.fontWeight = '600';
          tldrHeader.style.marginBottom = '4px';
          tldrHeader.textContent = '💡 Ключевая суть (TL;DR):';
          tldrBox.appendChild(tldrHeader);

          var summBullets = (doc.summary || '').split(/[\.\n]/).filter(function(s) { return s.trim().length > 10; });
          if (summBullets.length === 0) summBullets = ['Документ содержит регламент/исследование для задачи ' + doc.task_id];
          summBullets.slice(0, 3).forEach(function(b) {
            var bEl = el('div');
            bEl.textContent = '• ' + b.trim();
            bEl.style.margin = '2px 0';
            tldrBox.appendChild(bEl);
          });

          // Кнопки управления
          var btnRow = el('div');
          btnRow.style.display = 'flex';
          btnRow.style.gap = '8px';
          btnRow.style.marginTop = '8px';
          btnRow.style.flexWrap = 'wrap';

          // Кнопка Суть (TL;DR)
          var tldrBtn = el('button');
          tldrBtn.textContent = '💡 Суть';
          tldrBtn.style.padding = '6px 10px';
          tldrBtn.style.fontSize = '12px';
          tldrBtn.style.borderRadius = '8px';
          tldrBtn.style.border = '1px solid rgba(163,113,247,0.4)';
          tldrBtn.style.background = 'rgba(163,113,247,0.08)';
          tldrBtn.style.color = 'var(--accent)';
          tldrBtn.style.cursor = 'pointer';
          tldrBtn.addEventListener('click', function () {
            var isO = tldrBox.style.display === 'block';
            tldrBox.style.display = isO ? 'none' : 'block';
            tldrBtn.style.background = isO ? 'rgba(163,113,247,0.08)' : 'rgba(163,113,247,0.25)';
          });

          // Кнопка Читать
          var readBtn = el('button');
          readBtn.textContent = '📖 Читать';
          readBtn.style.padding = '6px 12px';
          readBtn.style.fontSize = '12px';
          readBtn.style.borderRadius = '8px';
          readBtn.style.border = '1px solid var(--accent)';
          readBtn.style.background = 'transparent';
          readBtn.style.color = 'var(--accent)';
          readBtn.style.cursor = 'pointer';

          var contentBox = el('div');
          contentBox.style.display = 'none';
          contentBox.style.marginTop = '10px';
          contentBox.style.padding = '12px';
          contentBox.style.background = 'rgba(0,0,0,0.35)';
          contentBox.style.borderRadius = '8px';
          contentBox.style.fontSize = '13px';
          contentBox.style.lineHeight = '1.6';
          contentBox.style.maxHeight = '420px';
          contentBox.style.overflowY = 'auto';

          readBtn.addEventListener('click', function () {
            var isOpen = contentBox.style.display === 'block';
            if (!isOpen) {
              contentBox.innerHTML = formatMarkdown(doc.content);
              contentBox.style.display = 'block';
              readBtn.textContent = '▲ Свернуть';
            } else {
              contentBox.style.display = 'none';
              readBtn.textContent = '📖 Читать';
            }
          });

          // Кнопка Копировать
          var copyBtn = el('button');
          copyBtn.textContent = '📋 Копия';
          copyBtn.style.padding = '6px 10px';
          copyBtn.style.fontSize = '12px';
          copyBtn.style.borderRadius = '8px';
          copyBtn.style.border = '0';
          copyBtn.style.background = 'rgba(255,255,255,0.06)';
          copyBtn.style.color = 'var(--text)';
          copyBtn.style.cursor = 'pointer';
          copyBtn.title = 'Скопировать текст Markdown в буфер';
          copyBtn.addEventListener('click', function () {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(doc.content).then(function() {
                showToast('Текст документа скопирован в буфер!');
              }).catch(function() {
                showToast('Ошибка доступа к буферу обмена');
              });
            } else {
              showToast('Буфер обмена недоступен в этом окне');
            }
          });

          // Кнопка Скачать .md
          var dlBtn = el('button');
          dlBtn.textContent = '📥 .md';
          dlBtn.style.padding = '6px 10px';
          dlBtn.style.fontSize = '12px';
          dlBtn.style.borderRadius = '8px';
          dlBtn.style.border = '0';
          dlBtn.style.background = 'rgba(255,255,255,0.06)';
          dlBtn.style.color = 'var(--text)';
          dlBtn.style.cursor = 'pointer';
          dlBtn.title = 'Скачать файл .md на устройство';
          dlBtn.addEventListener('click', function () {
            var blob = new Blob([doc.content], { type: 'text/markdown;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            var safeName = (doc.task_id + '_' + (doc.title || 'doc')).replace(/[^a-zA-Z0-9_\-\.]/g, '_') + '.md';
            a.download = safeName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Файл ' + safeName + ' скачан!');
          });

          // Кнопка Комментировать
          var commBtn = el('button');
          commBtn.textContent = '💬 Комментировать';
          commBtn.style.padding = '6px 12px';
          commBtn.style.fontSize = '12px';
          commBtn.style.borderRadius = '8px';
          commBtn.style.border = '0';
          commBtn.style.background = 'var(--card)';
          commBtn.style.color = 'var(--text)';
          commBtn.style.cursor = 'pointer';
          commBtn.addEventListener('click', function () {
            var c = prompt('Ваш комментарий к документу "' + doc.title + '" (прикрепится к задаче ' + doc.task_id + '):');
            if (c && c.trim()) {
              setAct('comm_' + doc.id, { a: 'comment', id: doc.task_id, text: '[' + doc.title + '] ' + c.trim() });
              showToast('Комментарий добавлен в очередь отправки в бот!');
            }
          });

          // Кнопка В архив / Восстановить
          var arcBtn = el('button');
          arcBtn.textContent = isDocArchived ? '📥 Восстановить' : '🗄 В архив';
          arcBtn.style.padding = '6px 10px';
          arcBtn.style.fontSize = '12px';
          arcBtn.style.borderRadius = '8px';
          arcBtn.style.border = '0';
          arcBtn.style.background = 'rgba(255,255,255,0.04)';
          arcBtn.style.color = 'var(--text-dim)';
          arcBtn.style.cursor = 'pointer';
          arcBtn.addEventListener('click', function () {
            var cur = JSON.parse(localStorage.getItem('shtab_archived_docs') || '[]');
            if (isDocArchived) {
              cur = cur.filter(function (x) { return x !== doc.id; });
              showToast('Документ возвращен из архива');
            } else {
              if (cur.indexOf(doc.id) === -1) cur.push(doc.id);
              showToast('Документ отправлен в архив');
            }
            localStorage.setItem('shtab_archived_docs', JSON.stringify(cur));
            renderList();
          });

          btnRow.appendChild(tldrBtn);
          btnRow.appendChild(readBtn);
          btnRow.appendChild(copyBtn);
          btnRow.appendChild(dlBtn);
          btnRow.appendChild(commBtn);
          btnRow.appendChild(arcBtn);

          item.appendChild(btnRow);
          item.appendChild(tldrBox);
          item.appendChild(contentBox);

          gBox.appendChild(item);
        });

        listContainer.appendChild(gBox);
      });
    }

    searchInput.addEventListener('input', function (e) {
      docsSearchTerm = e.target.value.toLowerCase().trim();
      renderList();
    });

    clearBtn.addEventListener('click', function () {
      docsSearchTerm = '';
      searchInput.value = '';
      renderList();
    });

    renderList();
  }

  if (tab === 'home') home(); else if (tab === 'dec') decisions(); else if (tab === 'work') work(); else if (tab === 'docs') docsView(); else if (tab === 'sys') system(); else archive();
  }
  drawTabs(); draw(); refreshSend();
})();
</script>
</body>
</html>
