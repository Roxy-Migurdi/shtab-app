<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Штаб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Штаб v2 (sh-o5n): приборная панель, а не витрина. Цвет только как сигнал; эмодзи нет; у каждой цифры есть время. */
  :root {
    --bg: #000; --card: #0b0b0b; --raise: #141414;
    --text: #ededea; --text-dim: #8b8b86; --hint: #8b8b86; --faint: #5c5c58;
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.15);
    --accent: #ededea; --accent-text: #000;
    --ok: #5bd08a; --warn: #e5b454; --bad: #f06a5e;
    --sans: "Geist", -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.23, 1, .32, 1);
  }
  :root[data-theme="light"] {
    --bg: #faf9f5; --card: #fff; --raise: #f1f0ec;
    --text: #141413; --text-dim: #6f6e69; --hint: #6f6e69; --faint: #a3a29c;
    --line: rgba(0,0,0,.07); --line2: rgba(0,0,0,.14);
    --accent: #141413; --accent-text: #faf9f5;
    --ok: #1f8a4c; --warn: #a86b00; --bad: #c23b30;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 14px 16px 110px; background: var(--bg); color: var(--text);
         font: 15px/1.5 var(--sans); letter-spacing: -.005em; -webkit-font-smoothing: antialiased; }
  button { font-family: var(--sans); }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.035em; margin: 0; }
  h2 { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; font: 500 10.5px var(--mono);
       text-transform: uppercase; letter-spacing: .14em; color: var(--faint); }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sub { color: var(--hint); font-size: 13px; }
  .title { font-weight: 600; letter-spacing: -.02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .big { font-size: 40px; font-weight: 500; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
  .bar { height: 2px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--text); transition: width .5s var(--ease); }
  .pct, .mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .delta { font-size: 11px; margin-left: 6px; } .up { color: var(--ok); } .down { color: var(--bad); }
  .chip { display: inline-block; font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px;
          border: 1px solid var(--line2); border-radius: 5px; color: var(--hint); margin-right: 6px; }
  .chip.p1 { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .chip.p2 { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .chip.me { color: var(--text); }
  .empty { color: var(--hint); text-align: center; padding: 36px 10px; }
  .tabs { display: flex; gap: 13px; margin: 12px -16px 4px; padding: 0 16px; position: sticky; top: 0; z-index: 3;
          background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
          border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { position: relative; flex: 0 0 auto; padding: 13px 0 12px; border: 0; background: none; color: var(--hint); font-size: 13px; white-space: nowrap; }
  .tabs button.on { color: var(--text); }
  .tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--text); }
  .tabs .n { margin-left: 4px; font: 500 10px var(--mono); color: var(--bad); vertical-align: super; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .btns button { flex: 1 1 46%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line2); border-radius: 10px; background: transparent;
                 color: var(--text); font-size: 14px; transition: transform 160ms var(--ease), background 160ms var(--ease); }
  .btns button:active, .tile:active, .link:active { transform: scale(.97); }
  .btns button.sel { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .btns button.yes.sel { background: var(--ok); border-color: var(--ok); color: #000; }
  .btns button.no.sel { background: var(--bad); border-color: var(--bad); color: #fff; }
  .note { font: 12px var(--mono); color: var(--hint); margin-top: 8px; }
  textarea { width: 100%; margin-top: 10px; min-height: 64px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line2);
             background: var(--raise); color: var(--text); font: 14px/1.5 var(--sans); resize: vertical; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { min-height: 100px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
          color: var(--text); transition: transform 160ms var(--ease), border-color 160ms var(--ease); }
  .tile .idx { display: block; font: 10px var(--mono); color: var(--faint); margin-bottom: 14px; letter-spacing: .08em; }
  .tile b { display: block; font-size: 14.5px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 3px; }
  .tile span { font-size: 12px; color: var(--hint); line-height: 1.4; }
  .tile.sel { border-color: var(--text); }
  .tile.danger b { color: var(--bad); }
  .step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; }
  .dot, .led { flex: 0 0 6px; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--faint); }
  .dot.now, .led.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
  .led.warn { background: var(--warn); } .led.bad { background: var(--bad); }
  .hint { font-size: 12.5px; color: var(--faint); margin: 6px 2px 12px; }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 4px; font: 11.5px var(--mono); color: var(--hint); }
  .status .led { margin-top: 0; }
  .tele { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 14px; background: var(--card); margin-top: 14px; }
  .tele > div { padding: 12px 12px 11px; border-left: 1px solid var(--line); }
  .tele > div:first-child { border-left: 0; }
  .tele .k { font: 500 9.5px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--faint); }
  .tele .v { font-size: 22px; font-weight: 500; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .tele .v.bad { color: var(--bad); } .tele .v.warn { color: var(--warn); }
  .list { border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; }
  .link { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: 0; border-top: 1px solid var(--line);
          background: none; color: var(--text); text-align: left; font-size: 14px; transition: transform 160ms var(--ease); }
  .link:first-child { border-top: 0; }
  .link .grow { flex: 1; min-width: 0; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ttl { cursor: pointer; }
  .ttl::after { content: '  +'; font: 12px var(--mono); color: var(--faint); white-space: pre; }
  .open > .ttl::after { content: '  −'; }
  .more { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line2); }
  .more .desc { font-size: 13.5px; line-height: 1.55; color: var(--text-dim); overflow-wrap: anywhere; }
  .more .meta { font: 11px var(--mono); color: var(--faint); margin-top: 8px; }
  .link .meta { font: 11.5px var(--mono); color: var(--hint); white-space: nowrap; }
  .link .arrow { color: var(--faint); font-family: var(--mono); }
  .meter { height: 2px; background: var(--line); margin-top: 8px; }
  .meter i { display: block; height: 100%; background: var(--text); }
  .meter i.warn { background: var(--warn); } .meter i.bad { background: var(--bad); }
  details.fold summary { list-style: none; cursor: pointer; }
  details.fold summary::-webkit-details-marker { display: none; }
  #send { position: fixed; left: 16px; right: 16px; bottom: 14px; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent);
          color: var(--accent-text); font-weight: 600; display: none; z-index: 5; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 78px; padding: 12px 14px; border-radius: 12px; background: var(--raise);
           border: 1px solid var(--line2); color: var(--text); display: none; z-index: 6; font-size: 13px; }
  pre { white-space: pre-wrap; word-break: break-all; font: 11px var(--mono); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="head"></div>
<div id="tabs" class="tabs"></div>
<div id="view"></div>
<button id="send"></button>
<div id="toast"></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  // вне Telegram скрипт всё равно отдаёт colorScheme = light, поэтому верим ему только внутри Telegram
  var theme = tg && tg.platform && tg.platform !== 'unknown' && tg.colorScheme ? tg.colorScheme : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  try {
    var BG = theme === 'light' ? '#faf9f5' : '#000000';
    tg.setHeaderColor(BG); tg.setBackgroundColor(BG); if (tg.setBottomBarColor) tg.setBottomBarColor(BG);
    tg.MainButton.setParams({ color: theme === 'light' ? '#141413' : '#ededea', text_color: theme === 'light' ? '#faf9f5' : '#000000' });
  } catch (e) {}

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function tick(n, one, few, many) { var m = n % 100, k = n % 10; return (m > 10 && m < 20) ? many : (k === 1 ? one : (k > 1 && k < 5 ? few : many)); }

  function readData() {
    var m = /[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return null;
    try {
      var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (e) { return null; }
  }

  // Данные приходят в адресе после «#» от бота и никуда не уходят. Действия идут только боту через Telegram.
  var d = readData();
  var head = document.getElementById('head'), tabsEl = document.getElementById('tabs'),
      view = document.getElementById('view'), sendBtn = document.getElementById('send'), toast = document.getElementById('toast');

  head.appendChild(el('h1', null, 'Штаб'));
  if (!d) {
    head.appendChild(el('div', 'sub', 'Открой Mini App кнопкой «Штаб» в чате с ботом: данные приходят оттуда.'));
    view.appendChild(el('div', 'empty', 'Нет данных'));
    var keys = (location.hash || '').replace(/^#/, '').split('&').map(function (p) { return p.split('=')[0]; }).filter(Boolean);
    view.appendChild(el('div', 'sub', 'Диагностика: в адресе параметры [' + keys.join(', ') + '], длина ' + (location.hash || '').length +
      ', платформа ' + (tg && tg.platform ? tg.platform : 'нет') + ', initData ' + (tg && tg.initData ? 'есть' : 'пусто')));
    return;
  }
  // Возраст снимка = пульс ПК: снимок пишет компьютер раз в 5 минут; старый снимок значит, что ПК спит или выключен.
  var st = el('div', 'status'); head.appendChild(st);
  function paintStatus() {
    var m = /(\d{2})\.(\d{2}) (\d{2}):(\d{2})/.exec(d.t || ''), age = null;
    if (m) { var now = new Date(); age = Math.round((now - new Date(now.getFullYear(), +m[2] - 1, +m[1], +m[3], +m[4])) / 60000); }
    clear(st);
    st.appendChild(el('span', 'led ' + (age === null ? '' : age <= 10 ? 'ok' : age <= 60 ? 'warn' : 'bad')));
    st.appendChild(el('span', null, age === null ? 'снимок ' + (d.t || '—') : age <= 10 ? 'ПК в сети · ' + d.t.slice(-5) + (d.pc ? ' · аптайм ' + d.pc[0] : '')
      : age <= 60 ? 'снимок отстаёт на ' + age + ' мин' : 'ПК молчит с ' + d.t));
  }
  paintStatus();

  // Заголовок карточки: нажатие раскрывает описание (полные данные — из шифрованного снимка, sh-q6f)
  function ttl(text, desc, meta) {
    var w = el('div'), t = el('div', 'ttl', text), box = null; w.appendChild(t);
    t.addEventListener('click', function () {
      if (box) { w.removeChild(box); box = null; w.classList.remove('open'); return; }
      box = el('div', 'more');
      box.appendChild(el('div', 'desc', desc || 'Описания нет в кратком снимке. Полный подгрузится сам, если ПК в сети.'));
      if (meta) box.appendChild(el('div', 'meta', meta));
      w.appendChild(box); w.classList.add('open');
    });
    return w;
  }
  function rowMeta(x) { return [x[0], x[7] ? 'обновлено ' + x[7] : ''].filter(Boolean).join(' · '); }

  // ---- отправка действий боту ----
  // По документации Telegram: из кнопки клавиатуры работает sendData (initData пуст); из кнопки меню — ссылка t.me/бот?start=…
  var inTelegram = !!(tg && tg.platform && tg.platform !== 'unknown');
  var fromKeyboard = inTelegram && !tg.initData;
  var queue = {}, comments = {};
  function qcount() { return Object.keys(queue).length; }
  function showToast(t) { toast.textContent = t; toast.style.display = 'block'; setTimeout(function () { toast.style.display = 'none'; }, 4000); }
  function setAct(key, act) { if (act) queue[key] = act; else delete queue[key]; refreshSend(); }
  function refreshSend() {
    var n = qcount(), label = 'Отправить (' + n + ')';
    if (inTelegram && tg.MainButton) { if (n) { tg.MainButton.setText(label); tg.MainButton.show(); } else tg.MainButton.hide(); }
    sendBtn.textContent = label;
    sendBtn.style.display = (n && !inTelegram) ? 'block' : 'none';
  }
  var CMD_LETTER = { status: 's', limits: 'l', board: 'b', orders: 'o', pause: 'p', modes: 'r', services: 'v', sync: 'y', pc: 'k' };
  function buildLink() {
    var parts = [];
    Object.keys(queue).forEach(function (k) {
      var a = queue[k], id = String(a.id || '').replace(/^sh-/, '');
      if (a.a === 'vote') parts.push((a.v === 'yes' ? 'y' : 'n') + id);
      else if (a.a === 'archive') parts.push('a' + id);
      else if (a.a === 'comment') parts.push('c' + id);
      else if (a.a === 'cmd' && CMD_LETTER[a.c]) parts.push('m' + CMD_LETTER[a.c]);
    });
    var p = 'd_' + parts.join('_');
    return p.length <= 64 ? p : null;
  }
  function submit() {
    var acts = Object.keys(queue).map(function (k) { return queue[k]; });
    if (!acts.length) return;
    var json = JSON.stringify({ v: 1, acts: acts });
    if (new TextEncoder().encode(json).length > 4000) { showToast('Слишком много действий за раз: отправь часть, потом остальное.'); return; }
    if (fromKeyboard) { tg.sendData(json); return; }
    if (inTelegram) {
      if (!d.b) { showToast('Бот не передал своё имя: открой Mini App из чата с ботом ещё раз.'); return; }
      var p = buildLink();
      if (!p) { showToast('Слишком много действий за раз: отправь часть, потом остальное.'); return; }
      tg.openTelegramLink('https://t.me/' + d.b + '?start=' + p);
      return;
    }
    clear(view); view.appendChild(el('div', 'card', 'Страница открыта вне Telegram, отправка недоступна. Действия:')); view.appendChild(el('pre', null, json));
  }
  sendBtn.addEventListener('click', submit);
  if (inTelegram && tg.MainButton) tg.MainButton.onClick(submit);

  // ---- вкладки ----
  var tab = 'home';
  var docsSearchTerm = '';
  var docsShowArchived = false;
  var docsAuthorFilter = 'all';
  var docsSortBy = 'date';
  var askN = d.ask ? d.ask.length : 0;
  var TABS = [['home', 'Сводка'], ['dec', 'Решения'], ['work', 'Работа'], ['docs', 'Файлы'], ['sys', 'Пульт'], ['arc', 'Архив']];
  function drawTabs() {
    clear(tabsEl);
    TABS.forEach(function (t) {
      var b = el('button', tab === t[0] ? 'on' : '', t[1]);
      if (t[0] === 'dec' && askN) b.appendChild(el('span', 'n', String(askN)));
      b.addEventListener('click', function () { go(t[0]); });
      tabsEl.appendChild(b);
    });
  }
  function go(t) { tab = t; drawTabs(); draw(); window.scrollTo(0, 0); }

  function bar(pct, color) {
    var b = el('div', 'bar'), f = el('i');
    f.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (color) f.style.background = color;
    b.appendChild(f); return b;
  }
  function limColor(p) { return p >= 90 ? 'var(--bad)' : (p >= 80 ? 'var(--warn)' : 'var(--ok)'); }
  function prioChip(p) { return el('span', 'chip p' + (p || 2), p === 1 ? 'срочно' : (p === 2 ? 'важно' : 'обычно')); }
  function ownerChip(o) { return el('span', 'chip' + (o === 'claude' || o === 'roxy' ? ' me' : ''), o === 'claude' ? 'Клод' : (o === 'roxy' ? 'ROXY' : (o === 'victoria' ? 'ты' : (o || 'не назначено')))); }

  // ---- Главное: приборная панель ----
  function meterRow(pct) {
    var m = el('div', 'meter'), i = el('i', pct >= 95 ? 'bad' : (pct >= 80 ? 'warn' : ''));
    i.style.width = Math.max(0, Math.min(100, pct)) + '%'; m.appendChild(i); return m;
  }
  function winState(t) { return String(t || '').split('(')[0].trim() || '—'; }
  function home() {
    var open = d.cards ? d.cards[0] - d.cards[1] : null, inWork = d.cards ? d.cards[2] : null;
    var tele = el('div', 'tele');
    function cell(k, v, cls, onTap) {
      var c = el('div'); c.appendChild(el('div', 'k', k)); c.appendChild(el('div', 'v' + (cls ? ' ' + cls : ''), v === null ? '—' : String(v)));
      if (onTap) { c.style.cursor = 'pointer'; c.addEventListener('click', onTap); }
      tele.appendChild(c);
    }
    cell('Открыто', open); cell('В работе', inWork, null, function () { go('work'); });
    cell('Решить', askN, askN ? 'bad' : null, function () { go('dec'); });
    cell('Службы', d.sv ? d.sv[0] + '/' + d.sv[1] : null, d.sv && d.sv[0] !== d.sv[1] ? 'warn' : null, function () { go('sys'); });
    view.appendChild(tele);

    if (askN) {
      view.appendChild(el('h2', null, 'Ждёт тебя'));
      var l = el('div', 'list');
      d.ask.slice(0, 3).forEach(function (x) {
        var r = el('button', 'link'), g = el('div', 'grow');
        g.appendChild(el('div', 'clamp', x[5] || x[1])); g.appendChild(el('div', 'meta', x[0]));
        r.appendChild(g); r.appendChild(el('span', 'arrow', '→'));
        r.addEventListener('click', function () { go('dec'); }); l.appendChild(r);
      });
      view.appendChild(l);
    }

    if (d.lim && d.lim.length) {
      view.appendChild(el('h2', null, 'Агенты и лимиты'));
      var al = el('div', 'list');
      d.lim.forEach(function (x) {
        var r = el('div', 'link'), g = el('div', 'grow'), top = el('div', 'row');
        top.appendChild(el('span', null, x[0]));
        top.appendChild(el('span', 'meta', (x[1] !== null ? x[1] + '% · ' : '') + (x[2] || '')));
        g.appendChild(top); if (x[1] !== null) g.appendChild(meterRow(x[1]));
        r.appendChild(g); al.appendChild(r);
      });
      view.appendChild(al);
      view.appendChild(el('div', 'hint', 'Процент — сколько лимита потрачено; время — когда он откатится. Данные на ' + (d.t || '—') + '.'));
    }

    if (d.pc) {
      view.appendChild(el('h2', null, 'Компьютер'));
      var pl = el('div', 'list');
      function pcRow(k, v) { var r = el('div', 'link'); r.appendChild(el('span', 'grow', k)); r.appendChild(el('span', 'meta', v)); pl.appendChild(r); }
      pcRow('Работает без перезагрузки', d.pc[0]);
      pcRow('Память занята', d.pc[2] + '% · свободно ' + d.pc[1] + ' ГБ');
      pcRow('Окно Клода', winState(d.pc[3]));
      pcRow('Окно ROXY', winState(d.pc[4]));
      pcRow('Ждут в очереди', String(d.pc[5] || 0));

  async function deriveDocsKey(password, saltB64, iterations) {
    var salt = Uint8Array.from(atob(saltB64), function (c) { return c.charCodeAt(0); });
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
  }

  async function decryptDocs(pw) {
    var resp = await fetch("docs.enc.json", { cache: "no-store" });
    if (!resp.ok) throw new Error("Файл docs.enc.json недоступен (" + resp.status + ")");
    var data = await resp.json();
    var key = await deriveDocsKey(pw, data.salt, data.iterations);
    var iv = Uint8Array.from(atob(data.iv), function (c) { return c.charCodeAt(0); });
    var ct = Uint8Array.from(atob(data.ciphertext), function (c) { return c.charCodeAt(0); });
    var plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
    var jsonText = new TextDecoder().decode(plainBuf);
    window.SHTAB_DOCS = JSON.parse(jsonText);
    sessionStorage.setItem("shtab_docs_password", pw);
    return window.SHTAB_DOCS;
  }

  function formatMarkdown(text) {
    if (!text) return '';
    var esc = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Fenced code blocks
    esc = esc.replace(/```([a-z0-9_-]*)\n([\s\S]*?)```/gim, function(m, lang, code) {
      return '<pre style="background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px;overflow-x:auto;font-family:monospace;font-size:12px;color:#c084fc;margin:8px 0;"><code>' + code + '</code></pre>';
    });

    // Table rows
    esc = esc.replace(/^\|(.+)\|$/gim, function(match, row) {
      var cells = row.split('|').map(function(c) { return c.trim(); });
      if (cells.every(function(c) { return /^:?-+:?$/.test(c); })) {
        return '';
      }
      return '<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--raise);font-size:12px;">' +
        cells.map(function(c) { return '<span style="flex:1;min-width:60px;">' + c + '</span>'; }).join('') +
        '</div>';
    });

    return esc
      .replace(/^### (.*$)/gim, '<h4 style="color:var(--accent);margin:10px 0 4px;font-size:14px;">$1</h4>')
      .replace(/^## (.*$)/gim, '<h3 style="color:#fff;margin:14px 0 6px;font-size:15px;border-bottom:1px solid var(--raise);padding-bottom:3px;">$1</h3>')
      .replace(/^# (.*$)/gim, '<h2 style="color:#fff;margin:16px 0 8px;font-size:16px;border-bottom:1px solid var(--line2);padding-bottom:4px;">$1</h2>')
      .replace(/\*\*(.*?)\*\*/gim, '<strong style="color:#fff;">$1</strong>')
      .replace(/\*(.*?)\*/gim, '<em style="color:#ddd;">$1</em>')
      .replace(/`([^`]+)`/gim, '<code style="background:var(--line);padding:2px 6px;border-radius:4px;color:#a371f7;font-family:monospace;font-size:12px;">$1</code>')
      .replace(/^\> (.*$)/gim, '<blockquote style="border-left:3px solid var(--accent);margin:8px 0;padding:4px 10px;background:rgba(163,113,247,0.06);color:var(--text-dim);border-radius:0 6px 6px 0;">$1</blockquote>')
      .replace(/^\- (.*$)/gim, '<div style="padding-left:14px;margin:2px 0;">• $1</div>')
      .replace(/\n\n/gim, '<div style="height:8px;"></div>');
  }

        filtered.sort(function (a, b) { return (a.title || '').localeCompare(b.title || ''); });
      }

      countBadge.textContent = 'Показано: ' + filtered.length + ' из ' + rawDocs.length;
      clearBtn.style.display = docsSearchTerm ? 'inline-block' : 'none';

      if (!filtered.length) {
        listContainer.appendChild(el('div', 'card hint', docsShowArchived ? 'В архиве нет документов.' : 'По запросу ничего не найдено.'));
        return;
      }

      var groups = {};
      filtered.forEach(function (d) {
        if (!groups[d.group]) groups[d.group] = [];
        groups[d.group].push(d);
      });

      Object.keys(groups).forEach(function (gName) {
        var gDocs = groups[gName];
        var gBox = el('div', 'card');
        gBox.appendChild(el('div', 'title', gName + ' (' + gDocs.length + ')'));

        gDocs.forEach(function (doc) {
          var isDocArchived = archived.indexOf(doc.id) !== -1;
          var item = el('div', 'item');
          item.style.padding = '10px 0';
          item.style.borderTop = '1px solid var(--raise)';

          var topRow = el('div');
          topRow.style.display = 'flex';
          topRow.style.justifyContent = 'space-between';
          topRow.style.alignItems = 'center';

          var tChip = el('span', 'prio');
          tChip.textContent = doc.task_id;
          tChip.style.background = 'rgba(163,113,247,0.18)';
          tChip.style.color = 'var(--accent)';
          tChip.style.fontWeight = '600';
          topRow.appendChild(tChip);

          var meta = el('span', 'hint');
          meta.style.fontSize = '12px';
          meta.textContent = doc.author + ' · ' + doc.date;
          topRow.appendChild(meta);

          item.appendChild(topRow);

          var dTitle = el('div');
          dTitle.style.fontWeight = '600';
          dTitle.style.fontSize = '14px';
          dTitle.style.margin = '6px 0 4px';
          dTitle.textContent = doc.title;
          item.appendChild(dTitle);

          var dSumm = el('div', 'hint');
          dSumm.style.fontSize = '13px';
          dSumm.textContent = doc.summary;
          item.appendChild(dSumm);

          // Блок ИИ-выжимки (Суть в 3 буллетах)
          var tldrBox = el('div');
          tldrBox.style.display = 'none';
          tldrBox.style.marginTop = '8px';
          tldrBox.style.padding = '10px 12px';
          tldrBox.style.background = 'rgba(163,113,247,0.1)';
          tldrBox.style.borderLeft = '3px solid var(--accent)';
          tldrBox.style.borderRadius = '0 8px 8px 0';
          tldrBox.style.fontSize = '12px';
          tldrBox.style.lineHeight = '1.5';
          tldrBox.style.color = 'var(--text)';

          var tldrHeader = el('div');
          tldrHeader.style.fontWeight = '600';
          tldrHeader.style.marginBottom = '4px';
          tldrHeader.textContent = 'Ключевая суть (TL;DR):';
          tldrBox.appendChild(tldrHeader);

          var summBullets = (doc.summary || '').split(/[\.\n]/).filter(function(s) { return s.trim().length > 10; });
          if (summBullets.length === 0) summBullets = ['Документ содержит регламент/исследование для задачи ' + doc.task_id];
          summBullets.slice(0, 3).forEach(function(b) {
            var bEl = el('div');
            bEl.textContent = '• ' + b.trim();
            bEl.style.margin = '2px 0';
            tldrBox.appendChild(bEl);
          });

          // Кнопки управления
          var btnRow = el('div');
          btnRow.style.display = 'flex';
          btnRow.style.gap = '8px';
          btnRow.style.marginTop = '8px';
          btnRow.style.flexWrap = 'wrap';

          // Кнопка Суть (TL;DR)
          var tldrBtn = el('button');
          tldrBtn.textContent = 'Суть';
          tldrBtn.style.padding = '6px 10px';
          tldrBtn.style.fontSize = '12px';
          tldrBtn.style.borderRadius = '8px';
          tldrBtn.style.border = '1px solid var(--line2)';
          tldrBtn.style.background = 'var(--raise)';
          tldrBtn.style.color = 'var(--accent)';
          tldrBtn.style.cursor = 'pointer';
          tldrBtn.addEventListener('click', function () {
            var isO = tldrBox.style.display === 'block';
            tldrBox.style.display = isO ? 'none' : 'block';
            tldrBtn.style.background = isO ? 'var(--raise)' : 'rgba(163,113,247,0.25)';
          });

          // Кнопка Читать
          var readBtn = el('button');
          readBtn.textContent = 'Читать';
          readBtn.style.padding = '6px 12px';
          readBtn.style.fontSize = '12px';
          readBtn.style.borderRadius = '8px';
          readBtn.style.border = '1px solid var(--accent)';
          readBtn.style.background = 'transparent';
          readBtn.style.color = 'var(--accent)';
          readBtn.style.cursor = 'pointer';

          var contentBox = el('div');
          contentBox.style.display = 'none';
          contentBox.style.marginTop = '10px';
          contentBox.style.padding = '12px';
          contentBox.style.background = 'var(--raise)';
          contentBox.style.borderRadius = '8px';
          contentBox.style.fontSize = '13px';
          contentBox.style.lineHeight = '1.6';
          contentBox.style.maxHeight = '420px';
          contentBox.style.overflowY = 'auto';

          readBtn.addEventListener('click', function () {
            var isOpen = contentBox.style.display === 'block';
            if (!isOpen) {
              contentBox.innerHTML = formatMarkdown(doc.content);
              contentBox.style.display = 'block';
              readBtn.textContent = '▲ Свернуть';
            } else {
              contentBox.style.display = 'none';
              readBtn.textContent = 'Читать';
            }
          });

          // Кнопка Копировать
          var copyBtn = el('button');
          copyBtn.textContent = 'Копия';
          copyBtn.style.padding = '6px 10px';
          copyBtn.style.fontSize = '12px';
          copyBtn.style.borderRadius = '8px';
          copyBtn.style.border = '0';
          copyBtn.style.background = 'var(--raise)';
          copyBtn.style.color = 'var(--text)';
          copyBtn.style.cursor = 'pointer';
          copyBtn.title = 'Скопировать текст Markdown в буфер';
          copyBtn.addEventListener('click', function () {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(doc.content).then(function() {
                showToast('Текст документа скопирован в буфер!');
              }).catch(function() {
                showToast('Ошибка доступа к буферу обмена');
              });
            } else {
              showToast('Буфер обмена недоступен в этом окне');
            }
          });

          // Кнопка Скачать .md
          var dlBtn = el('button');
          dlBtn.textContent = '.md';
          dlBtn.style.padding = '6px 10px';
          dlBtn.style.fontSize = '12px';
          dlBtn.style.borderRadius = '8px';
          dlBtn.style.border = '0';
          dlBtn.style.background = 'var(--raise)';
          dlBtn.style.color = 'var(--text)';
          dlBtn.style.cursor = 'pointer';
          dlBtn.title = 'Скачать файл .md на устройство';
          dlBtn.addEventListener('click', function () {
            var blob = new Blob([doc.content], { type: 'text/markdown;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            var safeName = (doc.task_id + '_' + (doc.title || 'doc')).replace(/[^a-zA-Z0-9_\-\.]/g, '_') + '.md';
            a.download = safeName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Файл ' + safeName + ' скачан!');
          });

          // Кнопка Комментировать
          var commBtn = el('button');
          commBtn.textContent = 'Комментировать';
          commBtn.style.padding = '6px 12px';
          commBtn.style.fontSize = '12px';
          commBtn.style.borderRadius = '8px';
          commBtn.style.border = '0';
          commBtn.style.background = 'var(--card)';
          commBtn.style.color = 'var(--text)';
          commBtn.style.cursor = 'pointer';
          commBtn.addEventListener('click', function () {
            var c = prompt('Ваш комментарий к документу "' + doc.title + '" (прикрепится к задаче ' + doc.task_id + '):');
            if (c && c.trim()) {
              setAct('comm_' + doc.id, { a: 'comment', id: doc.task_id, text: '[' + doc.title + '] ' + c.trim() });
              showToast('Комментарий добавлен в очередь отправки в бот!');
            }
          });

          // Кнопка В архив / Восстановить
          var arcBtn = el('button');
          arcBtn.textContent = isDocArchived ? 'Восстановить' : 'В архив';
          arcBtn.style.padding = '6px 10px';
          arcBtn.style.fontSize = '12px';
          arcBtn.style.borderRadius = '8px';
          arcBtn.style.border = '0';
          arcBtn.style.background = 'var(--raise)';
          arcBtn.style.color = 'var(--text-dim)';
          arcBtn.style.cursor = 'pointer';
          arcBtn.addEventListener('click', function () {
            var cur = JSON.parse(localStorage.getItem('shtab_archived_docs') || '[]');
            if (isDocArchived) {
              cur = cur.filter(function (x) { return x !== doc.id; });
              showToast('Документ возвращен из архива');
            } else {
              if (cur.indexOf(doc.id) === -1) cur.push(doc.id);
              showToast('Документ отправлен в архив');
            }
            localStorage.setItem('shtab_archived_docs', JSON.stringify(cur));
            renderList();
          });

          btnRow.appendChild(tldrBtn);
          btnRow.appendChild(readBtn);
          btnRow.appendChild(copyBtn);
          btnRow.appendChild(dlBtn);
          btnRow.appendChild(commBtn);
          btnRow.appendChild(arcBtn);

          item.appendChild(btnRow);
          item.appendChild(tldrBox);
          item.appendChild(contentBox);

          gBox.appendChild(item);
        });

        listContainer.appendChild(gBox);
      });
    }

    searchInput.addEventListener('input', function (e) {
      docsSearchTerm = e.target.value.toLowerCase().trim();
      renderList();
    });

    clearBtn.addEventListener('click', function () {
      docsSearchTerm = '';
      searchInput.value = '';
      renderList();
    });

    renderList();
  }

  if (tab === 'home') home(); else if (tab === 'dec') decisions(); else if (tab === 'work') work(); else if (tab === 'docs') docsView(); else if (tab === 'sys') system(); else archive();
  }
  // Полный снимок: шифрованный файл, ключ во фрагменте адреса (#k=, на сервер не уходит). Обновляется раз в минуту, пока Штаб открыт.
  var KEY = (/[#&]k=([A-Za-z0-9_-]{43})/.exec(location.hash) || [])[1];
  var SNAP_URL = /github\.io$/.test(location.hostname) ? 'https://raw.githubusercontent.com/roxy-migurdi/shtab-app/snap/snap.enc.json' : 'snap/snap.enc.json';
  function b64u(v) { v = v.replace(/-/g, '+').replace(/_/g, '/'); while (v.length % 4) v += '='; return Uint8Array.from(atob(v), function (c) { return c.charCodeAt(0); }); }
  async function loadFull() {
    if (!KEY || !window.crypto || !crypto.subtle) return;
    if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;  // не сбивать набор комментария
    try {
      var r = await fetch(SNAP_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      var e = await r.json();
      var k = await crypto.subtle.importKey('raw', b64u(KEY), 'AES-GCM', false, ['decrypt']);
      var full = JSON.parse(new TextDecoder('utf-8').decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(e.iv) }, k, b64u(e.ct))));
      if (d.full && full.t === d.t) return;
      d = full; d.full = true; askN = d.ask ? d.ask.length : 0;
      paintStatus(); drawTabs(); if (tab !== 'docs') draw();
    } catch (err) {}
  }
  drawTabs(); draw(); refreshSend();
  loadFull(); setInterval(function () { if (!document.hidden) loadFull(); }, 60000);
})();
</script>
</body>
